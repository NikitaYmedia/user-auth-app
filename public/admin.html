<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            padding: 30px;
        }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stats {
            background: #f1f3f5;
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
        }

        .stats h2 {
            margin: 0;
            font-size: 32px;
        }

        .user-list {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .user-list table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-list th,
        .user-list td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #search {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
        }

        .admin-button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="admin-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage registered users</p>
            </div>

            <button class="admin-button" id="logoutButton" >
                Log out
            </button>
        </div>

        <div class="stats">
            <p>Total registered users</p>
            <h2 id="totalUsers">Loading...</h2>
        </div>

        <div class="user-list">
            <h2>Registered Users</h2>

            <input type="search" id="search" placeholder="Search by email...">

            <p id="message">Loading users...</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="usersTable"></tbody>
            </table>
        </div>

    </div>

    <script src="/js/admin.js"></script>

</body>

</html>
