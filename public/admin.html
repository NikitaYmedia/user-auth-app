<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        body {
            padding: 30px;
        }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stats {
            background: #f1f3f5;
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
        }

        .stats h2 {
            margin: 0;
            font-size: 32px;
        }

        .user-list {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .user-list table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-list th,
        .user-list td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #search {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
        }

        .admin-button,
        .action-button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        .action-button {
            margin: 3px;
        }

        .profile-button {
            background: #e7f0ff;
            color: #174ea6;
        }

        .delete-button {
            background: #ffe8e8;
            color: #b42318;
        }

        .profile-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .profile-panel h3 {
            margin-top: 0;
        }

        .profile-panel p {
            overflow-wrap: anywhere;
        }

        #profileMessage {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="admin-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage registered users</p>
            </div>

            <button class="admin-button" id="logoutButton">
                Log out
            </button>
        </div>

        <div class="stats">
            <p>Total registered users</p>
            <h2 id="totalUsers">Loading...</h2>
        </div>

        <div class="user-list">
            <h2>Registered Users</h2>

            <input type="search" id="search" placeholder="Search by email...">

            <p id="message">Loading users...</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="usersTable"></tbody>
            </table>

            <div class="profile-panel" id="profilePanel">
                <h3>User Profile</h3>

                <p><strong>ID:</strong> <span id="profileId"></span></p>
                <p><strong>Email:</strong> <span id="profileEmail"></span></p>
                <p><strong>Registration date:</strong> <span id="profileDate"></span></p>
                <p><strong>Password:</strong> <span id="profilePassword"></span></p>

                <p id="profileMessage"></p>

                <button class="admin-button" id="closeProfile">
                    Close profile
                </button>
            </div>
        </div>

    </div>

    <script src="/js/admin.js"></script>

</body>

</html>
