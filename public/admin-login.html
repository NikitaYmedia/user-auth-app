<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page auth-page--admin">
    <header class="admin-topbar">
        <div class="admin-topbar__brand">
            <span class="admin-topbar__logo"><span class="icon icon-lock"></span></span>
            <span>Admin Console</span>
        </div>
        <span class="badge badge--dot badge--success">v2.5</span>
    </header>

    <main class="auth-page__main">
        <div class="auth">
            <div class="auth__logo"><span class="icon icon-shield-check"></span></div>
            <h1 class="auth__title">Administrator Login</h1>
            <p class="auth__subtitle">Enter your administrative credentials to access system operations.</p>

            <section class="card card--floating auth__card">
                <form id="adminLoginForm">
                    <label class="field">
                        <span class="field__label">Email address</span>
                        <input class="input" type="email" id="email" name="email" placeholder="Administrator email" autocomplete="username" required>
                    </label>

                    <div class="field">
                        <div class="field__label-row">
                            <label class="field__label" for="password">Password</label>
                        </div>
                        <span class="field__control">
                            <input class="input" type="password" id="password" name="password" placeholder="Administrator password" autocomplete="current-password" required>
                            <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                                <span class="icon"></span>
                            </button>
                        </span>
                    </div>

                    <label class="check">
                        <input class="check__input" type="checkbox" id="remember">
                        <span>Keep administrative session active for 8 hours</span>
                    </label>

                    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
                    <p class="form-message" id="message" role="status" aria-live="polite" hidden></p>
                </form>

                <div class="auth__links">
                    <a class="auth__back" href="/login.html"><span class="icon icon-arrow-left"></span>Back to user login</a>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/admin-login.js"></script>
</body>

</html>
