<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <form id="adminLoginForm">
        <h1>Administrator Login</h1>

        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="Administrator email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Administrator password" autocomplete="current-password"
            required>

        <button type="submit">Sign in</button>

        <p id="message" role="status" aria-live="polite"></p>

        <p><a href="/login.html">Back to user login</a></p>
    </form>

    <script src="/js/admin-login.js"></script>
</body>

</html>
