<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page auth-page--login">
    <main class="auth-page__main">
        <div class="auth">
            <div class="auth__logo"><span class="icon icon-lock"></span></div>
            <h1 class="auth__title">Reset your password</h1>
            <p class="auth__subtitle">Enter your new password below.</p>

            <section class="card card--floating auth__card">
                <form id="resetPasswordForm">
                    <label class="field">
                        <span class="field__label">New password</span>
                        <span class="field__control">
                            <input class="input" type="password" id="password" name="password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
                            <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                                <span class="icon"></span>
                            </button>
                        </span>
                    </label>
                    <label class="field">
                        <span class="field__label">Confirm new password</span>
                        <span class="field__control">
                            <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
                            <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                                <span class="icon"></span>
                            </button>
                        </span>
                    </label>

                    <button class="btn btn--primary btn--block" type="submit">Reset password</button>
                    <p class="form-message" id="message" role="status" aria-live="polite" hidden></p>
                </form>

                <div class="auth__links">
                    <a class="auth__back" href="/login.html"><span class="icon icon-arrow-left"></span>Back to sign in</a>
                </div>
            </section>

            <p class="auth__footer">&copy; 2026 Obsidian &amp; Pure. All rights reserved.</p>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/reset-password.js"></script>
</body>

</html>
