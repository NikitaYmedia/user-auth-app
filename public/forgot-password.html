<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page auth-page--login">
    <main class="auth-page__main">
        <div class="auth">
            <div class="auth__logo"><span class="icon icon-key"></span></div>
            <h1 class="auth__title">Forgot password?</h1>
            <p class="auth__subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <section class="card card--floating auth__card">
                <form id="forgotPasswordForm">
                    <label class="field">
                        <span class="field__label">Email address</span>
                        <input class="input" type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </label>

                    <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
                    <p class="form-message" id="message" role="status" aria-live="polite" hidden></p>
                </form>

                <div class="auth__links">
                    <p>Remember your password? <a href="/login.html">Sign in</a></p>
                </div>
            </section>

            <p class="auth__footer">&copy; 2026 Obsidian &amp; Pure. All rights reserved.</p>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/forgot-password.js"></script>
</body>

</html>
