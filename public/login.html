<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyAccount</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page auth-page--login">
    <main class="auth-page__main">
        <div class="auth">
            <div class="auth__logo"><span class="icon icon-lock"></span></div>
            <h1 class="auth__title">Login to Your Account</h1>
            <p class="auth__subtitle">Welcome back! Please enter your details.</p>

            <section class="card card--floating auth__card">
                <form id="loginForm">
                    <label class="field">
                        <span class="field__label">Email Address</span>
                        <input class="input" type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Password</span>
                        <span class="field__control">
                            <input class="input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                                <span class="icon"></span>
                            </button>
                        </span>
                    </label>

                    <button class="btn btn--primary btn--block" type="submit">Login</button>
                    <p class="form-message" id="message" role="status" aria-live="polite" hidden></p>
                </form>

                <div class="auth__links auth__links--left">
                    <p>Don't have an account? <a href="/register.html">Register here</a></p>
                    <p>You are admin? <a href="/admin-login.html">ADMIN</a></p>
                </div>
            </section>

        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
